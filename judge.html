function routePoints(id=state.route){return state.matchedPaths[id]||PRESET_ROUTES.find(r=>r.id===id).points}
function pointOnPath(points,fraction){
  const lengths=[0];let total=0;
  for(let i=1;i<points.length;i++){total+=Math.hypot((points[i][0]-points[i-1][0])*Math.cos(points[i][1]*Math.PI/180),points[i][1]-points[i-1][1]);lengths.push(total)}
  const target=Math.max(0,Math.min(1,fraction))*total;
  for(let i=1;i<points.length;i++){if(lengths[i]>=target){const f=(target-lengths[i-1])/Math.max(1e-12,lengths[i]-lengths[i-1]);return[points[i-1][0]+(points[i][0]-points[i-1][0])*f,points[i-1][1]+(points[i][1]-points[i-1][1])*f]}}
  return points.at(-1);
}
function geometry(small=false){
  const pts=routePoints(),minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1])),maxY=Math.max(...pts.map(p=>p[1]));
  const W=760,H=small?350:600,pad=small?64:90,cos=Math.cos((maxY+minY)/2*Math.PI/180),scale=Math.min((W-pad*2)/Math.max(1e-6,(maxX-minX)*cos),(H-pad*2)/Math.max(1e-6,maxY-minY));
  return{W,H,project:p=>[W/2+(p[0]-(maxX+minX)/2)*cos*scale,H/2-(p[1]-(maxY+minY)/2)*scale]};
}
function routeSvg(small=false){
  const g=geometry(small),pts=routePoints(),path=pts.map(g.project).map(p=>p.join(',')).join(' '),p=g.project(pointOnPath(pts,state.progress)),start=g.project(pts[0]),end=g.project(pts.at(-1)),id=small?'small':'large';
  const markers=FRACTIONS.map((f,i)=>{const xy=g.project(pointOnPath(pts,f));return`<g transform="translate(${xy})"><circle r="${small?11:16}" fill="${['#d5a320','#d77b32','#ce334c'][i]}" stroke="white" stroke-width="3"/><text text-anchor="middle" y="${small?4:5}" fill="white" font-size="${small?11:14}" font-weight="700">${i+1}</text></g>`}).join('');
  return`<svg class="route-schematic" viewBox="0 0 ${g.W} ${g.H}" role="img" aria-label="${route().name}预设路线概览，含车辆场景位置与三个风险节点"><defs><pattern id="grid-${id}" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#dce6ef" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" fill="#eef4f8"/><rect width="100%" height="100%" fill="url(#grid-${id})"/><g transform="translate(${small?0:state.mapPan[0]} ${small?0:state.mapPan[1]}) translate(${g.W/2} ${g.H/2}) scale(${small?1:state.mapZoom}) translate(${-g.W/2} ${-g.H/2})"><polyline points="${path}" fill="none" stroke="#d0ddea" stroke-width="21" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${path}" fill="none" stroke="white" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${path}" fill="none" stroke="#4279ec" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${start[0]}" cy="${start[1]}" r="8" fill="#fff" stroke="#2162e8" stroke-width="4"/><text x="${start[0]+13}" y="${start[1]+5}" font-size="${small?13:16}" fill="#516f90">起点</text><rect x="${end[0]-7}" y="${end[1]-7}" width="14" height="14" rx="3" fill="#284b78" stroke="white" stroke-width="3"/>${markers}<g data-car-marker="${id}" transform="translate(${p})"><circle r="${small?20:26}" fill="#2162e81b"/><rect x="-9" y="-14" width="18" height="28" rx="6" fill="#1859d4" stroke="white" stroke-width="3"/><path d="M-4-7H4M-4 6H4" stroke="#c5d8ff" stroke-width="3"/></g></g></svg>`;
}
function mapView(){const s=scene();return`<section class="map-workspace"><div class="map-surface"><div id="onlineMap" class="online-map" hidden></div><div class="map-heading"><select id="routeSelect" aria-label="选择永川路线">${SCENARIOS.map(x=>`<option value="${x.id}" ${state.route===x.id?'selected':''}>${x.short} · ${x.tag.split(' · ')[1]}</option>`).join('')}</select><button class="btn small" id="mapModeButton" data-action="map-online">加载在线地图</button></div><div class="map-route-holder" id="mapRouteHolder">${routeSvg()}</div><div class="map-controls"><button class="icon-button" data-action="map-plus" aria-label="放大地图">${ico('plus')}</button><button class="icon-button" data-action="map-minus" aria-label="缩小地图">${ico('minus')}</button><button class="icon-button" data-action="map-fit" aria-label="显示完整路线">${ico('target')}</button></div><div class="map-caption"><span id="mapSourceLabel">路线概览 · 非导航底图</span><span>预设场景位置</span></div></div><aside id="mapAside" class="map-aside"><button class="map-sheet-toggle" data-action="map-expand" aria-expanded="false" aria-label="展开路线详情"><span></span></button><div class="section-head"><h2>${s.name}</h2><span data-risk-badge></span></div><p class="map-note">${route().name} · ${s.weather}</p><div class="map-kv"><div><small>车速 km/h</small><b data-read="speed"></b></div><div><small>目标距离 m</small><b data-read="distance"></b></div><div><small>能见度 m</small><b data-read="visibility"></b></div><div><small>TTC s</small><b data-read="ttc"></b></div></div>${player(true)}<div class="map-extra"><div class="divider"></div><h3>沿途风险节点</h3><div class="chapter-list">${s.chapters.map((t,i)=>`<button data-seek="${FRACTIONS[i]}"><i>${i+1}</i><span>${t}</span><small>+${clock(FRACTIONS[i]*120)}</small></button>`).join('')}</div><div class="environment-grid"><div><small>天气</small><b>${s.weather}</b></div><div><small>湿度</small><b>${s.humidity}%</b></div><div><small>坡度</small><b>${s.slope}°</b></div></div><p class="source-caption" style="margin-top:13px">环境与位置为场景设定。在 let sdkPromise=null;
function loadMapSDK(){
  if(window.AMap)return Promise.resolve();if(sdkPromise)return sdkPromise;
  sdkPromise=new Promise((resolve,reject)=>{
    if(!MAP_CONFIG.mapKey)return reject(new Error('当前地图应用尚未配置'));
    if(MAP_CONFIG.mapSecurity)window._AMapSecurityConfig={securityJsCode:MAP_CONFIG.mapSecurity};
    const tag=document.createElement('script');tag.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(MAP_CONFIG.mapKey);tag.async=true;
    const timer=setTimeout(()=>{tag.remove();reject(new Error('在线底图加载较慢，路线概览可继续使用'))},7000);
    tag.onload=()=>{clearTimeout(timer);window.AMap?resolve():reject(new Error('地图服务暂不可用'))};tag.onerror=()=>{clearTimeout(timer);tag.remove();reject(new Error('在线底图暂不可用'))};document.head.append(tag);
  }).catch(e=>{sdkPromise=null;throw e});return sdkPromise;
}
async function loadOnlineMap(){
  if(state.page!=='map'||state.mapLoading||state.mapOnline)return;
  state.mapLoading=true;const generation=state.mapGeneration;$('mapModeButton').textContent='底图加载中…';
  try{
    await loadMapSDK();if(state.page!=='map'||generation!==state.mapGeneration)return;
    const box=$('onlineMap');box.hidden=false;
    const active=new AMap.Map(box,{zoom:15,center:pointOnPath(routePoints(),.5),mapStyle:'amap://styles/normal',showLabel:true});state.map=active;
    await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('底图暂未就绪')),6000);active.on('complete',()=>{clearTimeout(timer);resolve()})});
    if(state.map!==active||generation!==state.mapGeneration)return;
    state.mapOnline=true;$('mapRouteHolder').hidden=true;$('mapSourceLabel').textContent='高德地图 · 预设路线';$('mapModeButton').textContent='路线概览';
    const line=new AMap.Polyline({path:routePoints(),strokeColor:'#2162e8',strokeWeight:6,isOutline:true,outlineColor:'#fff',borderWeight:2});active.add(line);state.mapLine=line;
    state.mapMarker=new AMap.Marker({position:pointOnPath(routePoints(),state.progress),content:'<div class="map-live-dot"></div>',offset:new AMap.Pixel(-12,-12)});active.add(state.mapMarker);
    const fit=()=>active.setFitView([line],false,window.innerWidth<701?[80,270,36,36]:[85,45,45,45]);fit();
    const routeId=state.route,pts=routePoints();
    const placeNodes=()=>{state.mapNodes?.forEach(n=>n.setMap(null));state.mapNodes=FRACTIONS.map((f,i)=>new AMap.Marker({position:pointOnPath(routePoints(routeId),f),content:`<div class="map-event-dot">${i+1}</div>`,offset:new AMap.Pixel(-12,-12)}));state.mapNodes.forEach((n,i)=>{active.add(n);n.on('click',()=>openEvent(`SCN-${routeId.toUpperCase()}-${i+1}`))})};placeNodes();
    if(state.matchedPaths[routeId])$('mapSourceLabel').textContent='高德地图 · 已匹配道路';
    else AMap.plugin('AMap.Driving',()=>{
      if(state.map!==active)return;
      const driver=new AMap.Driving({policy:0,hideMarkers:true});
      const waypoints=pts.filter((_,i)=>i>0&&i<pts.length-1&&i%3===0);
      driver.search(pts[0],pts.at(-1),{waypoints},(status,result)=>{
        if(state.map!==active||state.route!==routeId)return;
        if(status==='complete'&&result.routes?.[0]?.steps){const matched=result.routes[0].steps.flatMap(s=>s.path||[]).map(p=>[typeof p.getLng==='function'?p.getLng():p.lng,typeof p.getLat==='function'?p.getLat():p.lat]).filter(p=>p.every(Number.isFinite));if(matched.length>2){state.matchedPaths[routeId]=matched;line.setPath(matched);placeNodes();fit();$('mapSourceLabel').textContent='高德地图 · 已匹配道路';syncReadings()}}
      });
    });
  }catch(error){if(generation!==state.mapGeneration)return;state.map?.destroy();state.map=null;state.mapOnline=false;if($('onlineMap'))$('onlineMap').hidden=true;if($('mapRouteHolder'))$('mapRouteHolder').hidden=false;if($('mapModeButton'))$('mapModeButton').textContent='重试在线底图';if($('mapSourceLabel'))$('mapSourceLabel').textContent='路线概览 · 在线底图暂不可用'}
  finally{if(generation===state.mapGeneration)state.mapLoading=false}
}

function mineView(){return`<section class="page">${pageHeader('我的浏览空间','从项目定位到数据来源，了解平台提供的能力')}<section class="card about-profile"><span class="brand-symbol">哨</span><div><h2>智路哨兵</h2><p>面向 Robotaxi 与商业车队的旁路安全监测</p></div>${badge('公开浏览','blue')}</section><div class="settings-grid profile-section"><section class="card card-pad"><h3>项目与技术</h3><div class="settings-list">${settingRow('shield','项目概述','定位、适用场景与系统边界','about')}${settingRow('link','三大核心技术','CAN 协议库、预处理与专用硬件','architecture')}${settingRow('file','预警效果与验证','比较口径、记录要素与验证要求','benchmark')}${settingRow('device','安装与样机资料','查看设备实物及安装位置示意','hardware')}</div></section><section class="card card-pad"><h3>浏览与记录</h3><div class="settings-list">${settingRow('map','三条路线总览','兴龙湖、凤凰湖产业园、茶山竹海','routes')}${settingRow('sound','预警声音',state.sound?'已开启：播放高危情节时提醒':'点击开启当前页面的高危声音提醒','sound')}${settingRow('download','导出场景记录','包含预警、参数、来源和本机处理记录','export-all')}${settingRow('refresh','重置场景记录','恢复初始预警状态与播放进度','reset')}</div></section></div><section class="card card-pad profile-section"><div class="section-head"><h3>访问与数据说明</h3><button class="text-button" data-action="source">查看详情</button></div><div class="diag-list">${[['访问方式','扫码直接浏览'],['页面内容','五个栏目全部开放'],['运行数据','预设场景，非实时采集'],['预警操作','仅保存在当前浏览器'],['车辆控制','用户端不提供控制指令'],['平台版本','V'+VERSION]].map(([k,v])=>`<div class="diag-item"><span>${k}</span>${badge(v,'blue')}</div>`).join('')}</div></section>${footer()}</section>`}
function dialog(title,html){state.playing=false;syncReadings();$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;const d=$('mainDialog');if(!d.open)d.showModal();$('dialogBody').scrollTop=0;d.scrollTop=0}
function closeDialog(){$('mainDialog').close();state.dialogEvent=null}
function actionDescription(action){return{ack:'已确认知悉',resolve:'已记录解除结果',archive:'已归档'}[action]||action}
function eventTrend(e){
  const frames=Array.from({length:31},(_,i)=>sampleFor(e.routeId,Math.max(0,Math.min(1,e.fraction+(i-15)/120))));
  const maxSpeed=40,maxDistance=70,W=620,H=178;
  const line=(key,max)=>frames.map((f,i)=>`${42+i*18},${135-f[key]/max*110}`).join(' ');
  return`<svg class="report-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="事件前后十五秒预设趋势：蓝线为车速，绿线为目标距离，两轴分别标注单位"><line x1="42" x2="582" y1="135" y2="135" stroke="#dbe4ef"/><line x1="42" x2="582" y1="80" y2="80" stroke="#eaf0f6" stroke-dasharray="4 4"/><line x1="312" x2="312" y1="20" y2="140" stroke="#d15a6a" stroke-dasharray="4 4"/><polyline points="${line('speed',maxSpeed)}" fill="none" stroke="#2464e8" stroke-width="2.8"/><polyline points="${line('targetDistance',maxDistance)}" fill="none" stroke="#0a947b" stroke-width="2.8"/><text x="8" y="28" fill="#2464e8" font-size="11">40</text><text x="592" y="28" fill="#0a947b" font-size="11">70</text><text x="16" y="139" fill="#2464e8" font-size="11">0</text><text x="592" y="139" fill="#0a947b" font-size="11">0</text><text x="42" y="14" font-size="11" fill="#2464e8">车速 km/h</text><text x="480" y="14" font-size="11" fill="#0a947b">目标距离 m</text><text x="318" y="36" fill="#b54a5c" font-size="11">触发时刻</text><text x="42" y="161" fill="#8293a5" font-size="11">−15 秒</text><text x="300" y="161" fill="#8293a5" font-size="11">0 秒</text><text x="545" y="161" fill="#8293a5" font-size="11">+15 秒</text></svg><p class="hint">蓝线使用左侧 0–40 km/h 量程，绿线使用右侧 0–70 m 量程；曲线为预设情景参数。</p>`;
}
function openEvent(id){
  const e=state.events.find(e=>e.id===id);if(!e)return;state.dialogEvent=e.id;const s=SCENARIOS.find(s=>s.id===e.routeId),t=e.snapshot;
  dialog('预警分析',`<div class="evidence-title"><h3>${e.title}</h3>${badge(LEVELS[e.level],COLORS[e.level])}${badge(STATUS[e.status],'blue')}</div><p class="hint" style="margin-top:9px">${s.name} · ${e.id} · 场景 +${clock(e.at)}</p><div class="event-detail-lead">${e.reason}</div><div class="evidence-grid">${[['场景车速',num(t.speed,1)+' km/h'],['目标距离',num(t.targetDistance,1)+' m'],['能见度',t.visibility+' m'],['碰撞时间 TTC',num(t.ttc,2)+' s'],['坡度设定',num(t.slope,1)+'°'],['场景天气',s.weather]].map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('')}</div><h3>触发前后情景</h3>${eventTrend(e)}<h3 style="margin-top:23px">处理记录</h3><ol class="evidence-steps"><li><span class="step-number done">1</span><div>预设风险情节<small>${e.title}</small></div><time>+${clock(e.at)}</time></li>${e.actions.map((a,i)=>`<li><span class="step-number done">${i+2}</span><div>${esc(actionDescription(a.action))}<small>${esc(a.note||a.actor)}</small></div><time>${esc(a.at)}</time></li>`).join('')}${e.actions.length?'':'<li><span class="step-number">2</span><div>等待确认<small>可以下方按钮体验预警处理过程</small></div></li>'}</ol><div class="report-state">数据来源：预设场景。当前入口没有真实设备连接或云端回执；本机确认不改变场景中的风险等级。</div><div class="button-row" style="margin-top:18px">${e.status==='new'?'<button class="btn primary" data-action="ack-event">确认已知悉</button>':''}${['new','acknowledged'].includes(e.status)?'<button class="btn" data-action="resolve-event">记录解除结果</button>':''}${e.status==='resolved'?'<button class="btn primary" data-action="archive-event">归档记录</button>':''}<button class="btn" data-action="play-event">定位该情节</button><button class="btn" data-action="export-event">${ico('download')}导出事件</button></div>`);
}
function mutateEvent(action,note=''){
  const e=state.events.find(e=>e.id===state.dialogEvent);if(!e)return;
  if(action==='ack'&&e.status!=='new')return;
  if(action==='resolve'&&(!['new','acknowledged'].includes(e.status)||!note.trim()))return toast('请填写解除依据');
  if(action==='archive'&&e.status!=='resolved')return;
  e.status={ack:'acknowledged',resolve:'resolved',archive:'archived'}[action];
  e.actions.push({action,at:'本机 '+new Date().toLocaleTimeString('zh-CN',{hour12:false}),actor:'当前浏览者',note:note.trim()||'当前浏览者操作'});
  saveState();if(state.page==='map')syncReadings();else render();openEvent(e.id);toast('场景处理记录已更新');
}
function resolveEvent(){const id=state.dialogEvent;dialog('记录解除结果',`<div class="source-banner">此处体验场景记录流程，填写内容只保存在当前浏览器。</div><form id="resolveForm" class="form-grid"><label for="resolutionNote">解除依据</label><textarea id="resolutionNote" maxlength="1000" required placeholder="例如：已查看该场景，目标离开冲突区域，完成复核。"></textarea><div class="button-row"><button class="btn primary" type="submit">保存解除结果</button><button class="btn" type="button" data-event="${id}">返回预警</button></div></form>`);$('resolveForm').onsubmit=e=>{e.preventDefault();mutateEvent('resolve',$('resolutionNote').value)}}
function deviceDialog(id){const s=SCENARIOS.find(s=>s.id===id);if(!s)return;dialog('设备档案',`<img class="vehicle-photo" style="border-radius:12px;height:210px" src="${ASSETS[id]}" alt="${s.type}同类车型参考图"><p class="source-caption" style="margin:8px 0 17px">同类车型资料图，不代表本项目已安装或已适配该品牌车辆。</p><h3>${s.name}</h3>${[['场景设备编号','SCN-'+id.toUpperCase()],['车辆类别',s.type],['关联路线',PRESET_ROUTES.find(r=>r.id===id).name],['场景条件',s.weather+' · '+s.environment],['接入方式','CAN 只读监听（设计）'],['安装位置方案','副驾驶仪表台内部'],['真实固件与车辆身份','需实机接入后读取'],['当前数据来源','预设场景参数']].map(([k,v])=>`<div class="data-line"><span>${k}</span><b>${v}</b></div>`).join('')}<div class="button-row" style="margin-top:19px"><button class="btn primary" data-action="hardware">查看样机资料</button><button class="btn" data-device-export="${id}">导出场景日志</button></div>`)}
function paragraphs(items){return`<div class="concept-list">${items.map(([title,description],i)=>`<article><h3><span class="concept-index">${i+1}</span>${title}</h3><p>${description}</p></article>`).join('')}</div>`}
function infoDialog(kind){
  if(kind==='source'){dialog('数据与访问说明',`<div class="source-banner">本入口供扫码浏览平台功能，全部运行数值、风险节点和初始处理记录均为预设场景内容。</div>${paragraphs([['场景数据','车速、目标距离、TTC、温度、时延及风险曲线按情景生成，不是实测结果。120 秒用于压缩浏览，位置随场景进度推进，不代表真实车辆在该路线的行驶用时。'],['设备与车辆照片','样机和线束沿用已有项目资料；车型图是同类车辆参考图，安装位置图是示意图，不作为实车安装验收证明。'],['浏览权限','评委扫码直接进入，五个栏目均可浏览，无需账号或服务器设置。预警确认、解除和归档只保存在当前浏览器。'],['真实接入','真实设备接入与账户验证由独立后台承担。本页面没有调用设备接口，不显示虚构的实时在线状态或车企云端回执。'],['验证指标','精度、预警提前量、召回率及误报率需由统一口径的原始试验报告支持，本入口不预填实测成绩。']])}<div class="button-row" style="margin-top:20px"><button class="btn primary" data-action="close-dialog">继续浏览平台</button></div>`);return}
  if(kind==='about'){dialog('项目概述',`<p style="font-size:15px;line-height:1.9">智路哨兵面向 Robotaxi 与商业车队，提供旁路式安全监测与预警。设备作为独立的安全观察员，读取车辆运行与环境信息，帮助关注复杂场景中的潜在风险。</p>${paragraphs([['为什么选择永川','围绕永川城市道路、园区交汇与山地坡道，组织雨雾、弯道、遮挡等复杂路况场景，形成有针对性的验证任务。'],['面向谁','Robotaxi 运营方、商业与试验车队，以及高校和试验场的验证工作。'],['提供什么','车辆信号适配、轻量化预处理、分级预警与可追溯记录，帮助运营人员理解风险及其触发依据。'],['系统边界','仅读取状态并提供预警，不接管原车智驾，不发送制动、转向或动力控制命令。']])}`);return}
  if(kind==='can'){dialog('核心技术一 · CAN 协议库',paragraphs([['按车型组织协议','围绕已取得使用条件的车型协议建立解析表，记录通道、报文标识、位段、倍率、偏移和单位。'],['检查报文有效性','结合周期、计数器和 CRC 等协议要求识别异常，避免将缺失或错误字段解释为正常状态。'],['统一车辆信号','将车速、转角、制动与油门等信号转换为统一字段，供后续预处理和风险判断使用。'],['保持只读接入','设备监听车辆网络，不通过用户端发送车辆控制帧。具体车型适配结果以相应台架和实车验证记录为准。']])+'<div class="button-row" style="margin-top:20px"><button class="btn primary" data-action="preprocess">查看轻量化预处理</button></div>');return}
  if(kind==='preprocess'){dialog('核心技术二 · 轻量化预处理',paragraphs([['有效性检查','检查采样时间、范围、完整性与报文状态，为每个信号保留质量标记。'],['异常点与连续量处理','抑制孤立异常点，对连续量进行适度平滑，减少噪声造成的错误波动。'],['离散去抖与突发保真','对离散状态做去抖；对突发风险保留快速变化信息，避免平滑掩盖关键事件。'],['统一时序输出','向风险模块输出统一字段、时间与有效性信息，便于多源分析和事件追溯。具体时序精度需测试报告验证。']])+'<div class="button-row" style="margin-top:20px"><button class="btn primary" data-action="hardware">查看专用硬件</button></div>');return}
  if(kind==='hardware'){dialog('专用硬件与样机资料',`<img class="photo-full" src="${ASSETS.device}" alt="项目样机实物与线束"><p class="source-caption" style="margin-top:8px">沿用项目已有样机实物资料。</p><div class="gallery"><button data-photo="wiring"><img src="${ASSETS.wiring}" alt="样机连接线束"><strong>设备接线</strong><small>已有样机实物资料</small></button><button data-photo="installation"><img src="${ASSETS.installation}" alt="副驾驶仪表台内部安装示意"><strong>安装位置</strong><small>基于设备外形的安装示意</small></button></div>${paragraphs([['只读安全接入','围绕单向隔离、只读监听设计车辆侧连接；用户端只提供状态和预警信息。'],['复杂路况适应','硬件设计关注密封、固定、导热、振动滤波及异常掉电记录保护，具体能力以检验结果为准。'],['扩展与通信','按实际需求选择惯导、定位和多模通信，关注遮挡、断网与补传场景。'],['验收要求','接线、供电、只读隔离与记录完整性应有对应验证。网页显示不等于硬件已完成车规认证或实车验收。']])}`);return}

function exportData(kind='all',id=''){
  let events=state.events,scenarios=SCENARIOS;
  if(kind==='event'){events=events.filter(e=>e.id===state.dialogEvent);scenarios=SCENARIOS.filter(s=>s.id===events[0]?.routeId)}
  if(kind==='device'){events=events.filter(e=>e.routeId===id);scenarios=SCENARIOS.filter(s=>s.id===id)}
  const body={platform:'智路哨兵',version:VERSION,source:'preset-scenario',notice:'预设场景数据，不是实测记录。操作仅在当前浏览器保存。',exportedAt:new Date().toISOString(),serverReceived:false,scenarios,events:events.map(e=>({...e,serverReceived:false,receiptId:null})),telemetry:scenarios.map(s=>({routeId:s.id,...sampleFor(s.id,s.id===state.route?state.progress:.42)}))};
  const url=URL.createObjectURL(new Blob([JSON.stringify(body,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`智路哨兵_场景${kind==='event'?'事件':kind==='device'?'设备日志':'记录'}_V7.2.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('场景记录已导出');
}
function showHighAlert(){const s=scene();$('urgentAlert').innerHTML=`<button class="icon-button" data-action="close-urgent" aria-label="关闭提醒">${ico('close')}</button><b>三级高危 · ${s.chapters[2]}</b><p>${s.short} · 预设风险情节</p><div class="button-row"><button class="btn small danger" data-event="SCN-${s.id.toUpperCase()}-3">查看预警分析</button></div>`;$('urgentAlert').hidden=false;clearTimeout(showHighAlert.timer);showHighAlert.timer=setTimeout(()=>$('urgentAlert').hidden=true,9000);if(state.sound)playSound()}
let audioContext=null;
function playSound(){try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();audioContext.resume().then(()=>{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.0001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.07,audioContext.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.4);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.42)})}catch{toast('当前浏览器不支持声音提醒')}}
function seek(value,notify=false){state.progress=Math.max(0,Math.min(1,Number(value)||0));state.playing=false;const level=riskAt(state.progress);if(notify&&level===3)showHighAlert();state.lastLevel=level;syncReadings()}
function syncReadings(){
  const t=sampleFor(state.route,state.progress),s=scene(),r=t.riskLevel;
  const values={speed:num(t.speed,1),distance:num(t.targetDistance,1),visibility:String(t.visibility),ttc:num(t.ttc,1),eventCount:'3'};
  document.querySelectorAll('[data-read]').forEach(el=>el.textContent=values[el.dataset.read]||'');
  document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=clock(state.progress*120));
  document.querySelectorAll('[data-progress]').forEach(el=>{if(document.activeElement!==el)el.value=Math.round(state.progress*1000)});
  document.querySelectorAll('[data-play-label]').forEach(el=>el.textContent=state.playing?'暂停播放':state.progress>=1?'重新播放':'继续播放');
  document.querySelectorAll('[data-risk-badge]').forEach(el=>el.innerHTML=badge(LEVELS[r],COLORS[r]));
  document.querySelectorAll('[data-risk-title]').forEach(el=>el.textContent=r===0?(state.progress>.9?'情节结束，风险回落':'场景处于正常监测阶段'):s.chapters[r-1]);
  document.querySelectorAll('[data-risk-reason]').forEach(el=>el.textContent=r===0?'继续观察车辆与环境状态；可拖动进度查看风险变化。':s.reasons[r-1]);
  if($('riskPanel'))$('riskPanel').className='scenario-status level-'+r;
  document.querySelectorAll('[data-chapter]').forEach(el=>el.classList.toggle('active',Number(el.dataset.chapter)===r));
  for(const id of ['small','large']){const el=document.querySelector(`[data-car-marker="${id}"]`);if(el){const p=geometry(id==='small').project(pointOnPath(routePoints(),state.progress));el.setAttribute('transform',`translate(${p[0]} ${p[1]})`)}}
  if(state.mapOnline&&state.mapMarker)state.mapMarker.setPosition(pointOnPath(routePoints(),state.progress));
}
function currentEvent(){return state.events.find(e=>e.routeId===state.route&&e.level===Math.max(1,riskAt(state.progress)))}
function resetDialog(){dialog('重置场景记录','<p class="hint">恢复本入口的初始预警状态与播放进度。你在本浏览器填写的场景处理备注将被清除，可先导出保留。</p><div class="button-row" style="margin-top:20px"><button class="btn" data-action="export-all">先导出记录</button><button class="btn primary" data-action="confirm-reset">重置场景</button><button class="btn" data-action="close-dialog">取消</button></div>')}
document.addEventListener('click',event=>{
  const b=event.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.page){navigate(d.page);return}
  if(d.route){chooseRoute(d.route);return}
  if(d.event){$('urgentAlert').hidden=true;openEvent(d.event);return}
  if(d.device){deviceDialog(d.device);return}
  if(d.deviceExport){exportData('device',d.deviceExport);return}
  if(d.deviceMap){closeDialog();state.route=d.deviceMap;state.progress=.42;navigate('map');return}
  if(d.photo){dialog(d.photo==='installation'?'安装位置示意':'设备接线资料',`<img class="photo-full" src="${ASSETS[d.photo]}" alt="${d.photo==='installation'?'副驾驶仪表台内部安装示意':'样机接线实物资料'}"><p class="hint" style="margin-top:12px">${d.photo==='installation'?'基于实物设备外形的安装位置示意，不作为车辆安装验收记录。':'沿用项目已有样机照片。'}</p>`);return}
  if(d.filter){state.filter=d.filter;render();return}
  if(d.seek!==undefined){seek(d.seek,true);return}
  const action=d.action;
  if(['source','about','can','preprocess','hardware','architecture','benchmark','routes'].includes(action)){infoDialog(action);return}
  if(action==='installation'){dialog('安装位置示意',`<img class="photo-full" src="${ASSETS.installation}" alt="副驾驶仪表台内部安装示意"><p class="hint" style="margin-top:12px">基于实物设备外形的安装位置示意，不作为车辆安装验收记录。</p>`);return}
  if(action==='play'){if(state.progress>=1)state.progress=0;state.playing=!state.playing;syncReadings()}
  if(action==='restart'){state.progress=0;state.lastLevel=0;state.playing=true;$('urgentAlert').hidden=true;syncReadings()}
  if(action==='high-risk'){seek(.73,true);if(state.page!=='home'&&state.page!=='map')navigate('map')}
  if(action==='current-alert'){const e=currentEvent();if(e)openEvent(e.id)}
  if(action==='close-dialog')closeDialog();
  if(action==='close-urgent')$('urgentAlert').hidden=true;
  if(action==='ack-event')mutateEvent('ack');
  if(action==='resolve-event')resolveEvent();
  if(action==='archive-event')mutateEvent('archive');
  if(action==='play-event'){const e=state.events.find(e=>e.id===state.dialogEvent);if(e){closeDialog();state.route=e.routeId;state.progress=e.fraction;state.lastLevel=e.level;navigate('map')}}
  if(action==='export-event')exportData('event');
  if(action==='export-events'||action==='export-all')exportData(action==='export-events'?'events':'all');
  if(action==='clear-filters'){state.filter='all';state.alertRoute='all';render()}
  if(action==='sound'){state.sound=!state.sound;if(state.sound)playSound();render();toast(state.sound?'已开启本页声音提醒':'已关闭声音提醒')}
  if(action==='reset')resetDialog();
  if(action==='confirm-reset'){state.events=seedEvents();state.progress=.42;state.lastLevel=riskAt(state.progress);state.playing=false;saveState();closeDialog();render();toast('已恢复初始场景')}
  if(action==='map-expand'){state.mapExpanded=!state.mapExpanded;$('mapAside').classList.toggle('expanded',state.mapExpanded);b.setAttribute('aria-expanded',String(state.mapExpanded));b.setAttribute('aria-label',state.mapExpanded?'收起路线详情':'展开路线详情')}
  if(action==='map-online'){if(state.mapOnline){state.mapGeneration++;state.map?.destroy();state.map=null;state.mapOnline=false;state.mapMarker=null;$('onlineMap').hidden=true;$('mapRouteHolder').hidden=false;$('mapRouteHolder').innerHTML=routeSvg();$('mapSourceLabel').textContent='路线概览 · 非导航底图';$('mapModeButton').textContent='在线底图'}else loadOnlineMap()}
  if(['map-plus','map-minus','map-fit'].includes(action)){
    if(state.mapOnline){if(action==='map-plus')state.map.zoomIn();if(action==='map-minus')state.map.zoomOut();if(action==='map-fit')state.map.setFitView([state.mapLine],false,window.innerWidth<701?[80,270,36,36]:[85,45,45,45])}
    else{state.mapZoom=action==='map-fit'?1:Math.max(.65,Math.min(3,state.mapZoom+(action==='map-plus'?.2:-.2)));if(action==='map-fit')state.mapPan=[0,0];$('mapRouteHolder').innerHTML=routeSvg()}
  }
});
document.addEventListener('change',event=>{if(event.target.id==='routeSelect')chooseRoute(event.target.value);if(event.target.id==='alertRouteSelect'){state.alertRoute=event.target.value;render()}});
document.addEventListener('input',event=>{if(event.target.matches('[data-progress]'))seek(Number(event.target.value)/1000)});
$('closeDialog').onclick=closeDialog;
$('mainDialog').addEventListener('click',event=>{if(event.target===$('mainDialog')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog()}});
window.addEventListener('hashchange',hashRoute);
let lastTick=performance.now();
setInterval(()=>{
  const now=performance.now(),delta=Math.min(1,(now-lastTick)/1000);lastTick=now;
  if(!state.playing||document.hidden||$('mainDialog').open||!['home','map'].includes(state.page))return;
  state.progress=Math.min(1,state.progress+delta/120);if(state.progress>=1)state.playing=false;
  const level=riskAt(state.progress);if(level===3&&state.lastLevel!==3)showHighAlert();state.lastLevel=level;syncReadings();
},200);
hashRoute();
</script>
</body>
</html>
